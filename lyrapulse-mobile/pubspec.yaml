name: lyrapulse_mobile
description: Lyra Pulse employee mobile application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  get: ^4.7.3
  google_fonts: ^9.0.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    